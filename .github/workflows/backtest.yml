name: Backtest

# Corre a pedido (Actions -> Backtest -> Run workflow). Baja el historico de BYMA (acciones y CEDEARs en pesos),
# corre el backtest de la estrategia base, lo cifra con CLAVE_ACCESO y lo publica en la misma pagina (pestana BACKTEST).
on:
  workflow_dispatch:
    inputs:
      variante:
        description: 'base = estrategia de caidas; filtro_tendencia = caidas + tendencia alcista; ruptura = estrategia NUEVA de ruptura al alza (se compara contra caidas y el Merval)'
        type: choice
        options: [base, filtro_tendencia, ruptura]
        default: base

permissions:
  contents: write
  pages: write
  id-token: write

# Mismo grupo que los informes diarios: nunca corren a la vez (evita choques al guardar en el repositorio).
concurrency:
  group: caidas
  cancel-in-progress: false

jobs:
  correr:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      cambios: ${{ steps.guardar.outputs.cambios }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pruebas del motor y de las estrategias
        run: |
          python tests_backtest.py
          python tests_ruptura.py
      - name: Backtest (baja unos 680 papeles de BYMA, tarda unos minutos)
        env:
          CLAVE_ACCESO: ${{ secrets.CLAVE_ACCESO }}
        run: python generar_backtest.py --variante ${{ inputs.variante }}
      - name: Guardar en el repositorio
        id: guardar
        run: |
          git config user.name "caidas-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then echo "cambios=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "Backtest ${{ inputs.variante }} $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
          echo "cambios=true" >> "$GITHUB_OUTPUT"

  publicar:
    needs: correr
    if: needs.correr.outputs.cambios == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: d
        uses: actions/deploy-pages@v4
