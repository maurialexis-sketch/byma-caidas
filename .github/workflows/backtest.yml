name: Backtest

# Corre a pedido (Actions -> Backtest -> Run workflow). Baja el historico de BYMA (acciones y CEDEARs en pesos),
# corre el backtest de la estrategia base, lo cifra con CLAVE_ACCESO y lo publica en la misma pagina (pestana BACKTEST).
on:
  workflow_dispatch:
    inputs:
      variante:
        description: 'base = estrategia de caidas; filtro_tendencia = caidas + tendencia alcista; ruptura = estrategia NUEVA de ruptura al alza (se compara contra caidas y el Merval); ruptura_trailing = ruptura con trailing stop del 15 por ciento en vez de las 20 ruedas (publica dos versiones); ruptura_5pos = ruptura con solo trailing y cartera de 5 posiciones de 20 por ciento contra la de 2; grilla_ruptura = grilla de la ruptura con solo trailing (2/3/5 posiciones x trailing 15/20 por ciento) con estabilidad por dia de arranque; ruptura_escalonada = ruptura con salida escalonada (vende 40 por ciento a +10, 40 a +15 y 20 a +20; stop 8 y luego trailing 8) en 3 posiciones, contra la ruptura con solo trailing 15 por ciento; bollinger = estrategia de Bandas de Bollinger (giro de la linea central en U, salida por tramos en las bandas) en 3 posiciones, con los parametros guardados o los de abajo'
        type: choice
        options: [base, filtro_tendencia, ruptura, ruptura_trailing, ruptura_5pos, grilla_ruptura, ruptura_escalonada, bollinger]
        default: base
      grupo:
        description: 'Opcional: solo papeles de este grupo (Merval o CEDEAR)'
        required: false
        default: ''
      sector:
        description: 'Opcional: solo este sector (energeticas, bancos, tecnologicas, ETF, alimentarias, otros)'
        required: false
        default: ''
      subsector:
        description: 'Opcional, solo tecnologicas: IA, computadoras, satelites, otras'
        required: false
        default: ''
      bb_periodo:
        description: 'Bollinger: periodo de la media central, ruedas (vacio = el guardado; de fabrica 20)'
        required: false
        default: ''
      bb_desvios:
        description: 'Bollinger: desvios de las bandas (vacio = el guardado; de fabrica 2)'
        required: false
        default: ''
      bb_dias:
        description: 'Bollinger: dias de pendiente positiva que confirman el giro (vacio = el guardado; de fabrica 3)'
        required: false
        default: ''
      bb_ventana:
        description: 'Bollinger: ventana de deteccion del patron, ruedas (vacio = el guardado; de fabrica 10)'
        required: false
        default: ''
      bb_magnitud:
        description: 'Bollinger: magnitud minima del giro, por ciento (vacio = el guardado; de fabrica 1)'
        required: false
        default: ''
      bb_salida:
        description: 'Bollinger: salida como peso1,peso2,peso3,stop (por ejemplo 1,1,1,1; stop 1 = si, 0 = no; vacio = la guardada)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

# Mismo grupo que los informes diarios: nunca corren a la vez (evita choques al guardar en el repositorio).
concurrency:
  group: caidas
  cancel-in-progress: false

jobs:
  correr:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      cambios: ${{ steps.guardar.outputs.cambios }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pruebas del motor y de las estrategias
        run: |
          python tests_backtest.py
          python tests_ruptura.py
          python tests_escalonada.py
          python tests_bollinger.py
          python tests_parametros.py
          python tests_indices.py
          python tests_sectores.py
      - name: Backtest (baja unos 680 papeles de BYMA, tarda unos minutos)
        env:
          CLAVE_ACCESO: ${{ secrets.CLAVE_ACCESO }}
          VARIANTE: ${{ inputs.variante }}
          GRUPO: ${{ inputs.grupo }}
          SECTOR: ${{ inputs.sector }}
          SUBSECTOR: ${{ inputs.subsector }}
          P_BBP: ${{ inputs.bb_periodo }}
          P_BBD: ${{ inputs.bb_desvios }}
          P_BBN: ${{ inputs.bb_dias }}
          P_BBV: ${{ inputs.bb_ventana }}
          P_BBM: ${{ inputs.bb_magnitud }}
          P_BBS: ${{ inputs.bb_salida }}
        run: |
          ARGS=""
          [ -n "$GRUPO" ] && ARGS="$ARGS --grupo $GRUPO"
          [ -n "$SECTOR" ] && ARGS="$ARGS --sector $SECTOR"
          [ -n "$SUBSECTOR" ] && ARGS="$ARGS --subsector $SUBSECTOR"
          python generar_backtest.py --variante "$VARIANTE" $ARGS --bb-periodo "$P_BBP" --bb-desvios "$P_BBD" --bb-dias "$P_BBN" --bb-ventana "$P_BBV" --bb-magnitud "$P_BBM" --bb-salida "$P_BBS"
      - name: Guardar en el repositorio
        id: guardar
        run: |
          git config user.name "caidas-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          if [ -f parametros.json ]; then git add parametros.json; fi
          if git diff --cached --quiet; then echo "cambios=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "Backtest ${{ inputs.variante }} $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
          echo "cambios=true" >> "$GITHUB_OUTPUT"

  publicar:
    needs: correr
    if: needs.correr.outputs.cambios == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: d
        uses: actions/deploy-pages@v4
