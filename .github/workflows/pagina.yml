name: Publicar pagina

# Publica la pagina (carpeta docs/) cuando se cambia a mano, sin generar ningun informe. Los informes automaticos (commits del bot) publican por su propio workflow.
on:
  push:
    branches: [main]
    paths: ['docs/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: caidas
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url || steps.d2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: d
        uses: actions/deploy-pages@v4
        continue-on-error: true      # GitHub a veces falla al leer el artefacto (pasó el 18/11 y el 20/11): se reintenta una vez
      - name: Esperar antes de reintentar la publicacion
        if: steps.d.outcome == 'failure'
        run: sleep 60
      - id: d2
        if: steps.d.outcome == 'failure'
        uses: actions/deploy-pages@v4
