name: Informe diario

# Dos formas de correrlo:
#   1) A demanda: boton "Correr ahora" de la pestana CANDIDATOS (o Actions -> Informe diario -> Run workflow, donde se pueden cargar los 4 parametros).
#   2) Automatico: lunes a viernes a las 18:00 (hora Argentina), con la rueda cerrada. Si ese dia no hubo rueda o faltan datos, SALTEA y deja el aviso
#      en la pagina (no falla).
# Barre el universo liquido de acciones y CEDEARs en pesos, aplica los filtros de candidatos, lo cifra con CLAVE_ACCESO y lo publica en la misma pagina.
# Los parametros editables quedan guardados en parametros.json (se commitea junto con el informe). Es un filtro, no una recomendacion de compra.
on:
  schedule:
    # Hora en UTC (Argentina = UTC-3, sin horario de verano): 21:00 UTC = 18:00 AR. GitHub puede atrasar los trabajos programados unos minutos
    # (no los adelanta), lo que ayuda: BYMA publica la vela del dia unos minutos despues del cierre.
    - cron: '0 21 * * 1-5'
  workflow_dispatch:
    inputs:
      piso:
        description: 'Piso de liquidez, millones de $ (vacio = el guardado; de fabrica 1000)'
        required: false
        default: ''
      media:
        description: 'Largo de la media de tendencia, ruedas (vacio = el guardado; de fabrica 200)'
        required: false
        default: ''
      recorrido:
        description: 'Recorrido minimo a la resistencia, % (vacio = el guardado; de fabrica 10)'
        required: false
        default: ''
      rb:
        description: 'Relacion riesgo/beneficio minima (vacio = la guardada; de fabrica 2)'
        required: false
        default: ''
      bb_periodo:
        description: 'Bollinger: periodo de la media central, ruedas (vacio = el guardado; de fabrica 20)'
        required: false
        default: ''
      bb_desvios:
        description: 'Bollinger: desvios de las bandas (vacio = el guardado; de fabrica 2)'
        required: false
        default: ''
      bb_dias:
        description: 'Bollinger: dias de pendiente positiva que confirman el giro (vacio = el guardado; de fabrica 3)'
        required: false
        default: ''
      bb_ventana:
        description: 'Bollinger: ventana de deteccion del patron, ruedas (vacio = el guardado; de fabrica 10)'
        required: false
        default: ''
      bb_magnitud:
        description: 'Bollinger: magnitud minima del giro, por ciento (vacio = el guardado; de fabrica 1)'
        required: false
        default: ''
      bb_otros:
        description: 'Bollinger: peso1,peso2,peso3,stop,velas_caida,velas_giro,periodo_listados (por ejemplo 1,1,1,1,5,1,5; stop 1 = si, 0 = no; vacio = lo guardado)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

# Mismo grupo que los demas trabajos: nunca corren a la vez (evita choques al guardar en el repositorio).
concurrency:
  group: caidas
  cancel-in-progress: false

jobs:
  correr:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      cambios: ${{ steps.guardar.outputs.cambios }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Pruebas del informe y de lo que usa
        run: |
          python tests_parametros.py
          python tests_bollinger.py
          python tests_escalonada.py
          python tests_informe.py
          python tests_indices.py
          python tests_sectores.py
          python tests_backtest.py
          python tests_ruptura.py
      - name: Informe de candidatos (baja unos 680 papeles de BYMA, tarda unos minutos)
        env:
          CLAVE_ACCESO: ${{ secrets.CLAVE_ACCESO }}
          EVENTO: ${{ github.event_name }}
          P_PISO: ${{ inputs.piso }}
          P_MEDIA: ${{ inputs.media }}
          P_RECORRIDO: ${{ inputs.recorrido }}
          P_RB: ${{ inputs.rb }}
          P_BBP: ${{ inputs.bb_periodo }}
          P_BBD: ${{ inputs.bb_desvios }}
          P_BBN: ${{ inputs.bb_dias }}
          P_BBV: ${{ inputs.bb_ventana }}
          P_BBM: ${{ inputs.bb_magnitud }}
          P_BBS: ${{ inputs.bb_otros }}
        run: |
          EXTRA=""
          if [ "$EVENTO" = "schedule" ]; then EXTRA="--programado"; fi
          python generar_informe.py $EXTRA --piso "$P_PISO" --media "$P_MEDIA" --recorrido "$P_RECORRIDO" --rb "$P_RB" \
            --bb-periodo "$P_BBP" --bb-desvios "$P_BBD" --bb-dias "$P_BBN" --bb-ventana "$P_BBV" --bb-magnitud "$P_BBM" --bb-otros "$P_BBS"
      - name: Guardar en el repositorio
        id: guardar
        run: |
          git config user.name "caidas-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          if [ -f parametros.json ]; then git add parametros.json; fi
          if git diff --cached --quiet; then echo "cambios=false" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "Informe de candidatos $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done
          echo "cambios=true" >> "$GITHUB_OUTPUT"

  publicar:
    needs: correr
    if: needs.correr.outputs.cambios == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: d
        uses: actions/deploy-pages@v4
