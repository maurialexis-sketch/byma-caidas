name: Verificar informes

# Diagnostico: dice que informes publicados abre la clave guardada en CLAVE_ACCESO. No imprime contenido.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Probar la clave contra los informes
        env:
          CLAVE_ACCESO: ${{ secrets.CLAVE_ACCESO }}
        run: python verificar_informes.py 14
