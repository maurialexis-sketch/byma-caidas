<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0E1621">
<meta name="mobile-web-app-capable" content="yes">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Caídas BYMA</title>
<style>
  :root{--bg:#0E1621;--panel:#17212E;--panel2:#1E2A38;--border:#2A3949;--text:#E7EEF5;--muted:#8DA0B3;--accent:#4F8FD6;
        --go:#35B37E;--stop:#E5544B;--warn:#E0A64B;--mono:ui-monospace,"SF Mono",Consolas,monospace;
        --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.45;
       padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
  main{max-width:720px;margin:0 auto;padding:14px 16px 48px}
  header{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px}
  h1{font-size:19px;margin:0} .hora{font-size:12px;color:var(--muted);text-align:right}
  .seg{display:flex;background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:3px;margin-bottom:12px}
  .seg button{flex:1;background:none;border:none;color:var(--muted);font:600 14px var(--sans);padding:10px 6px;border-radius:8px;cursor:pointer}
  .seg button.on{background:var(--panel2);color:var(--text)}
  .info{font-size:12px;color:var(--muted);margin-bottom:10px}
  select{width:100%;background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:8px;font:13px var(--sans);padding:9px 10px;margin-bottom:12px}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
  .stat{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:10px 6px;text-align:center}
  .stat .n{font:600 22px var(--mono)} .stat .l{font-size:10.5px;color:var(--muted);margin-top:2px}
  .go{color:var(--go)} .warn{color:var(--warn)} .stop{color:var(--stop)}
  .aviso{border-radius:9px;padding:10px 12px;font-size:13px;margin-bottom:10px;border:1px solid}
  .aviso.rojo{background:rgba(229,84,75,.12);color:var(--stop);border-color:rgba(229,84,75,.35);font-weight:600}
  .aviso.ambar{background:rgba(224,166,75,.1);color:var(--warn);border-color:rgba(224,166,75,.3)}
  .card{background:var(--panel);border:1px solid var(--border);border-left:4px solid var(--border);border-radius:10px;padding:12px 14px;margin-bottom:9px}
  .card.VERDE{border-left-color:var(--go)} .card.AMARILLO{border-left-color:var(--warn)} .card.ROJO{border-left-color:var(--stop)}
  .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .tk{font-weight:700;font-size:17px} .caida{font:600 17px var(--mono)}
  .pill{font-size:10.5px;font-weight:700;border:1px solid;border-radius:20px;padding:2px 8px;margin-right:8px;vertical-align:2px}
  .det{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted);margin-top:6px}
  .det b{color:var(--text);font-weight:500;font-family:var(--mono)}
  .win{font:12.5px var(--mono);margin-top:6px} .alerta{font-size:12px;color:var(--warn);margin-top:6px}
  .nota{font-size:12px;color:var(--muted);margin-top:14px} .vacio{text-align:center;color:var(--muted);padding:26px 8px}
  details{margin-top:12px;font-size:13px;color:var(--muted)} summary{cursor:pointer}
  .pie{display:flex;justify-content:space-between;gap:10px;margin-top:18px;font-size:12px}
  .pie a,.pie button{color:var(--muted);background:none;border:none;font:12px var(--sans);text-decoration:underline;cursor:pointer;padding:0}
  /* acceso */
  #acceso{max-width:360px;margin:12vh auto 0;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:24px}
  #acceso h2{font-size:20px;margin:0 0 4px} #acceso p{color:var(--muted);font-size:13px;margin:0 0 18px}
  #acceso label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}
  #acceso input{width:100%;background:var(--panel2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:17px;padding:12px}
  #acceso input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(79,143,214,.2)}
  #acceso button{width:100%;margin-top:14px;background:var(--accent);color:#08111c;border:none;border-radius:8px;font:600 16px var(--sans);padding:13px;cursor:pointer}
  #acceso button:disabled{opacity:.6} #msg{min-height:20px;margin-top:12px;font-size:13px;color:var(--stop)}
  /* backtest */
  .bt-heroes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
  .bt-hero{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px}
  .bt-hero .n{font:600 24px var(--mono)} .bt-hero .l{font-size:11px;color:var(--muted);margin-top:2px}
  table.bt{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:6px}
  table.bt th,table.bt td{padding:7px 6px;border-bottom:1px solid var(--border);text-align:right;vertical-align:top}
  table.bt th:first-child,table.bt td:first-child{text-align:left;color:var(--muted)}
  table.bt td{white-space:nowrap} table.bt td:first-child{white-space:normal}
  table.bt th{font-size:11px;color:var(--muted);font-weight:600} table.bt td{font-family:var(--mono)}
  table.bt td small{display:block;color:var(--muted);font-size:11px}
  h3.bt{font-size:14px;margin:18px 0 8px}
  .graf{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:8px 6px 4px;margin-bottom:6px}
  .graf svg{display:block;width:100%;height:auto;max-width:640px;margin:0 auto}
  .leyenda{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted);padding:2px 8px 6px}
  .leyenda i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
  .op{background:var(--panel);border:1px solid var(--border);border-radius:9px;padding:9px 12px;margin-bottom:6px}
  .op .mot{font-size:10.5px;font-weight:600;color:var(--muted);border:1px solid var(--border);border-radius:20px;padding:1px 7px;margin-left:6px}
  .tw{overflow-x:auto}
  table.bt.chica{font-size:12px} table.bt.chica th,table.bt.chica td{padding:6px 3px;white-space:normal} table.bt.chica td small{white-space:normal}
  .sup{font-size:12.5px;color:var(--muted);padding-left:18px} .sup li{margin-bottom:6px} .sup b{color:var(--text);font-weight:600}
</style>
</head>
<body>
<main>
  <form id="acceso" hidden autocomplete="on">
    <h2>Caídas BYMA</h2>
    <p>Acceso privado. Los informes están cifrados: la clave se usa solo en este dispositivo.</p>
    <label for="clave">Clave de acceso</label>
    <input id="clave" type="password" autocomplete="current-password" required>
    <button id="entrar" type="submit">Entrar</button>
    <div id="msg" role="alert"></div>
  </form>

  <div id="app" hidden>
    <header><h1>Caídas BYMA</h1><div class="hora" id="hora"></div></header>
    <div class="seg" id="seg">
      <button data-fn="compra" class="on">COMPRA 12:00</button>
      <button data-fn="venta">VENTA 15:50</button>
      <button data-fn="backtest">BACKTEST</button>
    </div>
    <div class="info" id="info"></div>
    <select id="hist" aria-label="Historial de informes"></select>
    <div id="out"><div class="vacio">Cargando…</div></div>
    <div class="pie"><a id="correr" href="#" target="_blank" rel="noopener">Correr ahora (en GitHub)</a><button id="salir">Cerrar sesión</button></div>
  </div>
</main>
<script>
"use strict";
var $=function(i){return document.getElementById(i)};
var fn="compra",META=null,INDICE=[],KEY=null,CUR=null;
var f1=new Intl.NumberFormat("es-AR",{minimumFractionDigits:1,maximumFractionDigits:1,signDisplay:"always"});
var fn1=new Intl.NumberFormat("es-AR",{minimumFractionDigits:1,maximumFractionDigits:1});
var fp=new Intl.NumberFormat("es-AR",{maximumFractionDigits:2});
var fi=new Intl.NumberFormat("es-AR",{maximumFractionDigits:0});
function esc(t){var d=document.createElement("div");d.textContent=t==null?"":String(t);return d.innerHTML}
function b64(s){return Uint8Array.from(atob(s),function(c){return c.charCodeAt(0)})}
function dmy(f){return f.slice(8,10)+"/"+f.slice(5,7)}

// ---------- clave: se deriva acá y se guarda como CryptoKey NO extraíble en IndexedDB (la clave en texto no se guarda) ----------
function idb(modo,fnc){return new Promise(function(res,rej){var q=indexedDB.open("caidas",1);
  q.onupgradeneeded=function(){q.result.createObjectStore("k")};q.onerror=function(){rej(q.error)};
  q.onsuccess=function(){var tx=q.result.transaction("k",modo),st=tx.objectStore("k"),r=fnc(st);
    tx.oncomplete=function(){res(r&&r.result)};tx.onerror=function(){rej(tx.error)}}})}
function guardarKey(k){return idb("readwrite",function(s){return s.put(k,"key")}).catch(function(){})}
function leerKey(){return idb("readonly",function(s){return s.get("key")}).catch(function(){return null})}
function borrarKey(){return idb("readwrite",function(s){return s.delete("key")}).catch(function(){})}
function derivar(clave){
  return crypto.subtle.importKey("raw",new TextEncoder().encode(clave),"PBKDF2",false,["deriveKey"]).then(function(base){
    return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(META.salt),iterations:META.iter,hash:"SHA-256"},base,
      {name:"AES-GCM",length:256},false,["decrypt"])})}
function descifrar(key,env){
  return crypto.subtle.decrypt({name:"AES-GCM",iv:b64(env.iv)},key,b64(env.ct)).then(function(b){return JSON.parse(new TextDecoder().decode(b))})}
function traer(url){return fetch(url,{cache:"no-cache"}).then(function(r){if(!r.ok)throw new Error(r.status);return r.json()})}

// ---------- pantalla ----------
function tarjeta(p){
  var col=p.senal==="VERDE"?"go":p.senal==="AMARILLO"?"warn":"stop";
  var win=[2,3,4].map(function(d){var v=f1.format(p.caidas_pct[d]);
    return d+"d "+(p.ventanas_que_disparan.indexOf(d)>=0?"<b class='"+col+"'>"+v+"*</b>":v)}).join(" · ");
  return '<div class="card '+p.senal+'"><div class="top"><div><span class="pill '+col+'">'+p.senal+'</span><span class="tk">'+esc(p.ticker)+
    '</span></div><div class="caida '+col+'">'+f1.format(p.caida_pct)+'%</div></div><div class="win">'+win+'</div>'+
    '<div class="det"><span>Precio <b>'+fp.format(p.precio)+'</b></span><span>Tendencia <b>'+esc(p.tendencia)+'</b></span>'+
    '<span>Soporte <b>'+(p.soporte?fp.format(p.soporte)+" (a "+fn1.format(p.dist_soporte_pct)+"%)":"sin soporte")+'</b></span>'+
    '<span>Monto <b>'+fi.format(p.monto_millones)+' M</b></span></div>'+
    ((p.alertas||[]).length?'<div class="alerta">⚠ '+esc(p.alertas.join("; "))+'</div>':"")+'</div>'}

function pintar(r,entrada){
  var c=r.conteo,u=r.universo,x=r.contexto||{},hoy=new Date().toISOString().slice(0,10),h="";
  var delDia=entrada.fecha===new Date(Date.now()-3*3600e3).toISOString().slice(0,10);
  $("hora").textContent="Informe del "+dmy(entrada.fecha)+" "+entrada.hora;
  $("info").innerHTML=(delDia?"":"<b class='warn'>No es de hoy.</b> ")+esc(x.origen||"")+
    (x.hora_precios?' · Precios del panel de las <b>'+esc(x.hora_precios.slice(0,5))+'</b> ('+x.atraso_precios_min+' min de atraso)':"");
  h+='<div class="stats"><div class="stat"><div class="n go">'+c.VERDE+'</div><div class="l">VERDE comprable</div></div>'+
     '<div class="stat"><div class="n warn">'+c.AMARILLO+'</div><div class="l">AMARILLO vigilar</div></div>'+
     '<div class="stat"><div class="n stop">'+c.ROJO+'</div><div class="l">ROJO estudio</div></div>'+
     '<div class="stat"><div class="n">'+r.con_caida+'/'+u.liquidas+'</div><div class="l">con caída</div></div></div>';
  if(r.en_bloque)h+='<div class="aviso rojo">Caída en bloque: una parte grande del mercado líquido cae y casi todo en ROJO.</div>';
  (x.advertencias||[]).forEach(function(a){h+='<div class="aviso ambar">'+esc(a)+'</div>'});
  h+=r.papeles.length?r.papeles.map(tarjeta).join(""):'<div class="vacio">Ningún papel cumple alguna caída.</div>';
  if((u.sin_precio_hoy||[]).length)h+='<div class="aviso ambar">Sin precio de hoy (no medidos): '+esc(u.sin_precio_hoy.join(", "))+'</div>';
  if(Object.keys(u.con_error||{}).length)h+='<div class="aviso rojo">Sin respuesta de BYMA (no medidos): '+esc(Object.keys(u.con_error).join(", "))+'</div>';
  if((r.sin_caida||[]).length)h+='<details><summary>Sin caída ('+r.sin_caida.length+')</summary><div style="margin-top:6px">'+
    r.sin_caida.map(function(s){return esc(s.ticker)+" "+f1.format(s.caidas_pct["2"])+"%"}).join(" · ")+'</div></details>';
  h+='<div class="nota">Precio de ahora vs cierre de hace 2/3/4 ruedas (umbrales −3,5% / −5% / −7%); * = ventana que dispara. '+
     'Verde: alcista y a ≤3% de un soporte. Amarillo: alcista lejos del soporte (o lateral). Rojo: bajista. Panel líder en pesos, monto mayor a 1.000 M. '+
     'Hora verificada: '+esc(x.fuente_hora||"")+'.</div>';
  $("out").innerHTML=h}


// ---------- BACKTEST ----------
var mesAbr=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
function dmy2(f){return f.slice(8,10)+"/"+f.slice(5,7)+"/"+f.slice(2,4)}
function fm(n){return n==null?"—":(n<0?"−":"")+"$ "+fi.format(Math.abs(n))}
function fpc(n,d){return n==null?"—":new Intl.NumberFormat("es-AR",{minimumFractionDigits:d,maximumFractionDigits:d,signDisplay:"always"}).format(n)+"%"}
function fnu(n,d){return n==null?"∞":new Intl.NumberFormat("es-AR",{minimumFractionDigits:d,maximumFractionDigits:d}).format(n)}
function sg(n){return n>0?"go":n<0?"stop":""}
function cel(v,c){return "<td class=\""+(c||"")+"\">"+v+"</td>"}

function grafico(e){
  var W=380,H=250,L=44,R=8,T=10,B=24,n=e.fechas.length;
  var COL=["var(--stop)","var(--go)","var(--muted)"];
  var S=(e.extras?[{n:e.nombre_base||"Estrategia",c:"var(--accent)",v:e.base,w:2.2}].concat(e.extras.map(function(x,i){return {n:x.n,c:COL[i%3],v:x.v,w:1.6,d:i===1?"4 3":null}})).concat([{n:"Merval",c:"var(--warn)",v:e.merval,w:1.8}])
        :e.otra?[{n:e.nombre_base||"Estrategia",c:"var(--accent)",v:e.base,w:2.2},{n:e.nombre_otra,c:"var(--stop)",v:e.otra,w:1.8},{n:"Merval",c:"var(--warn)",v:e.merval,w:1.8}]
        :[{n:"Estrategia",c:"var(--accent)",v:e.base,w:2.2},{n:"Merval",c:"var(--warn)",v:e.merval,w:1.8},
         {n:"Variante 50% patrimonio",c:"var(--muted)",v:e.variante,w:1.2,d:"4 3"}]).filter(function(x){return x.v});
  var mn=Infinity,mx=-Infinity;
  S.forEach(function(x){x.v.forEach(function(y){if(y!=null){mn=Math.min(mn,y);mx=Math.max(mx,y)}})});
  var pad=(mx-mn)*0.06;mn-=pad;mx+=pad;
  var X=function(i){return L+(W-L-R)*i/(n-1)},Y=function(v){return T+(H-T-B)*(1-(v-mn)/(mx-mn))};
  var g="";
  var paso=Math.pow(10,Math.floor(Math.log10((mx-mn)/4)));
  var k=[1,2,2.5,5,10].map(function(m){return m*paso}).find(function(s){return (mx-mn)/s<=5});
  for(var t=Math.ceil(mn/k)*k;t<=mx;t+=k){
    g+="<line x1=\""+L+"\" x2=\""+(W-R)+"\" y1=\""+Y(t)+"\" y2=\""+Y(t)+"\" stroke=\"var(--border)\" stroke-width=\"1\"/>"+
       "<text x=\""+(L-5)+"\" y=\""+(Y(t)+3.5)+"\" text-anchor=\"end\" font-size=\"10\" fill=\"var(--muted)\">"+fnu(t/1e6,t%1e6?1:0)+" M</text>"}
  var ult="";
  e.fechas.forEach(function(f,i){var m=f.slice(0,7),mes=parseInt(f.slice(5,7),10);
    if(m!==ult&&(mes-1)%3===0)g+="<text x=\""+X(i)+"\" y=\""+(H-8)+"\" text-anchor=\""+(X(i)>W-R-20?"end":"middle")+"\" font-size=\"10\" fill=\"var(--muted)\">"+mesAbr[mes-1]+" "+f.slice(2,4)+"</text>";
    ult=m});
  var cap=e.base[0];
  g+="<line x1=\""+L+"\" x2=\""+(W-R)+"\" y1=\""+Y(cap)+"\" y2=\""+Y(cap)+"\" stroke=\"var(--muted)\" stroke-width=\"1\" stroke-dasharray=\"2 4\"/>";
  S.forEach(function(x){
    var d="",ant=false;
    x.v.forEach(function(y,i){if(y==null){ant=false;return}d+=(ant?"L":"M")+X(i).toFixed(1)+" "+Y(y).toFixed(1)+" ";ant=true});
    g+="<path d=\""+d+"\" fill=\"none\" style=\"stroke:"+x.c+"\" stroke-width=\""+x.w+"\" stroke-linejoin=\"round\""+(x.d?" stroke-dasharray=\""+x.d+"\"":"")+"/>"});
  var ley=S.map(function(x){return "<span><i style=\"background:"+x.c+"\"></i>"+esc(x.n)+"</span>"}).join("");
  return "<div class=\"graf\"><svg viewBox=\"0 0 "+W+" "+H+"\" role=\"img\" aria-label=\"Curva de capital contra el Merval\">"+g+"</svg><div class=\"leyenda\">"+ley+"</div></div>"}

function filaOp(o){
  var c=sg(o.resultado);
  return "<div class=\"op\"><div class=\"top\"><span class=\"tk\">"+esc(o.ticker)+(o.ajustado?"*":"")+"<span class=\"mot\">"+esc(o.motivo)+"</span></span>"+
    "<span class=\"caida "+c+"\">"+fpc(o.resultado_pct,1)+"</span></div>"+
    "<div class=\"det\"><span>"+dmy2(o.fecha_entrada)+" <b>"+fp.format(o.precio_entrada)+"</b> → "+dmy2(o.fecha_salida)+" <b>"+fp.format(o.precio_salida)+"</b></span>"+
    "<span>"+o.ruedas+" ruedas</span><span class=\""+c+"\"><b>"+fm(o.resultado)+"</b></span></div></div>"}

function comparacionBT(r){
  if(r.comparacion_salidas)return comparacionSal(r);
  if(r.comparacion_estrategias)return comparacionEst(r);
  var c=r.comparacion;if(!c)return "";
  var b=c.base,f=c.filtro,d=c.diagnostico;
  function fila(nom,vb,vf,delta,mejor,dec){
    var cl=mejor===0||delta===0?"":((delta>0)===(mejor>0)?"go":"stop");
    return "<tr><td>"+nom+"</td>"+cel(vb)+cel(vf)+cel(delta==null?"":(delta>0?"+":"")+fnu(delta,dec==null?(delta%1?1:0):dec),cl)+"</tr>";
  }
  var h="<h3 class=\"bt\">Comparación contra la corrida base</h3>"+
    "<div class=\"nota\" style=\"margin:0 0 8px\">"+esc(c.regla)+" Misma fecha de datos, mismo período y mismos costos.</div>"+
    "<table class=\"bt\"><thead><tr><th></th><th>Base</th><th>Con filtro</th><th>Dif.</th></tr></thead><tbody>"+
    fila("Ganancia total",fpc(b.ganancia_total_pct,1)+"<small>"+fm(b.ganancia_total)+"</small>",fpc(f.ganancia_total_pct,1)+"<small>"+fm(f.ganancia_total)+"</small>",f.ganancia_total_pct-b.ganancia_total_pct,1)+
    fila("Profit Factor",fnu(b.profit_factor,2),fnu(f.profit_factor,2),f.profit_factor-b.profit_factor,1,2)+
    fila("% ganadores",fnu(b.ganadores_pct,1)+"%",fnu(f.ganadores_pct,1)+"%",f.ganadores_pct-b.ganadores_pct,1)+
    fila("Cantidad de trades",b.trades,f.trades,f.trades-b.trades,0)+
    fila("Max Drawdown","−"+fnu(b.max_drawdown.pct,1)+"%<small>"+fm(-b.max_drawdown.monto)+"</small>","−"+fnu(f.max_drawdown.pct,1)+"%<small>"+fm(-f.max_drawdown.monto)+"</small>",f.max_drawdown.pct-b.max_drawdown.pct,-1)+
    fila("Payoff Ratio",fnu(b.payoff_ratio,2),fnu(f.payoff_ratio,2),f.payoff_ratio-b.payoff_ratio,1,2)+
    fila("Ganancia media por trade",fpc(b.ganancia_media_trade_pct,2),fpc(f.ganancia_media_trade_pct,2),f.ganancia_media_trade_pct-b.ganancia_media_trade_pct,1,2)+
    fila("CAGR",fpc(b.cagr_pct,1),fpc(f.cagr_pct,1),f.cagr_pct-b.cagr_pct,1)+
    fila("Señales de entrada",b.senales,f.senales,f.senales-b.senales,0)+"</tbody></table>"+
    "<div class=\"nota\" style=\"margin-top:2px\">Dif. = con filtro − base (en puntos porcentuales para los %). Verde = mejora, rojo = empeora.</div>";
  if(d&&d.pasan&&d.eliminadas&&d.pasan.n&&d.eliminadas.n){
    h+="<div class=\"aviso ambar\" style=\"margin-top:10px\"><b>Cómo les fue, una por una, a las señales de la base:</b> las "+d.pasan.n+" que el filtro deja pasar rindieron en promedio "+
      fpc(d.pasan.media_pct,2)+" por operación ("+fnu(d.pasan.ganadoras_pct,1)+"% ganadoras); las "+d.eliminadas.n+" que elimina, "+fpc(d.eliminadas.media_pct,2)+
      " ("+fnu(d.eliminadas.ganadoras_pct,1)+"% ganadoras). Neto de costos y sin el límite de 2 posiciones.</div>";
  }

}

function reglasRuptura(p){
  return "<li><b>Entrada</b> (al cierre): papel líquido (monto promedio de 5 ruedas ≥ "+fi.format(p.piso_monto/1e6)+" M), en tendencia alcista (cierre por encima de su media móvil de "+p.ma_larga+" ruedas; "+p.ma_corta+" si el papel todavía no tiene "+p.ma_larga+" de histórico), que cierra por encima de una resistencia de 8 meses (zona de pivotes con 2+ toques) que el cierre anterior todavía no había superado. Si rompe varias zonas, la resistencia rota es la más alta.</li>"+
    (p.salida==="trailing"?"<li><b>Salida</b>: trailing stop del "+fnu(p.trailing_pct,0)+"%. Arranca "+fnu(p.trailing_pct,0)+"% por debajo del cierre de entrada y se recalcula cada día como "+fnu(p.trailing_pct,0)+"% por debajo del máximo cierre desde la compra; <b>nunca baja</b>. Se vende cuando el cierre lo toca (a ese cierre). <b>No hay límite de ruedas.</b> "+(p.stop_ruptura?"Además sale si el papel vuelve a cerrar por debajo de la resistencia rota.":"No hay stop de ruptura: el trailing lo reemplaza.")+"</li>":"<li><b>Salida</b> (lo que ocurra primero): el papel vuelve a <b>cerrar</b> por debajo de la resistencia rota (sale a ese cierre; no hay stop intradiario) o "+p.dias_max+" ruedas. No hay objetivo de ganancia: el tiempo es la única salida con ganancia.</li>");
}

  var h="<h3 class=\"bt\">Ruptura contra Caídas y Merval</h3>"+

    "<table class=\"bt\"><thead><tr><th></th><th>Ruptura</th><th>Caídas</th><th>Merval</th></tr></thead><tbody>"+
    fila("Ganancia total",fpc(a.ganancia_total_pct,1)+money(a.ganancia_total),fpc(b.ganancia_total_pct,1)+money(b.ganancia_total),m?fpc(m.retorno_total_pct,1):null,[sg(a.ganancia_total),sg(b.ganancia_total),m?sg(m.retorno_total_pct):""])+
    fila("Profit Factor",fnu(a.profit_factor,2),fnu(b.profit_factor,2),null)+
    fila("% ganadores",fnu(a.ganadores_pct,1)+"%",fnu(b.ganadores_pct,1)+"%",null)+

    fila("Max Drawdown","−"+fnu(a.max_drawdown.pct,1)+"%"+money(-a.max_drawdown.monto),"−"+fnu(b.max_drawdown.pct,1)+"%"+money(-b.max_drawdown.monto),m?"−"+fnu(m.max_drawdown.pct,1)+"%"+money(-m.max_drawdown.monto):null,["stop","stop","stop"])+
    fila("Payoff Ratio",fnu(a.payoff_ratio,2),fnu(b.payoff_ratio,2),null)+
    fila("CAGR",fpc(a.cagr_pct,1),fpc(b.cagr_pct,1),m?fpc(m.cagr_pct,1):null,[sg(a.cagr_pct),sg(b.cagr_pct),m?sg(m.cagr_pct):""])+
    fila("Señales de entrada",a.senales,b.senales,null)+"</tbody></table>"+
    "<div class=\"nota\" style=\"margin-top:2px\">El Merval es comprar y mantener: no tiene profit factor, % de ganadores ni trades. Mismos datos, período, gestión (máx. 2 posiciones, mitad del efectivo libre) y costos para las dos estrategias.</div>";
  if(s&&s.ruptura&&s.caidas&&s.ruptura.n&&s.caidas.n){
    h+="<div class=\"aviso ambar\" style=\"margin-top:10px\"><b>Las señales una por una</b> (sin el límite de 2 posiciones, neto de costos): "+

      "las "+s.caidas.n+" de caídas, "+fpc(s.caidas.media_pct,2)+" ("+fnu(s.caidas.ganadoras_pct,1)+"% ganadoras, mediana "+fpc(s.caidas.mediana_pct,2)+", profit factor "+fnu(s.caidas.profit_factor,2)+"). "+
      "La cartera de 2 posiciones toma una pequeña parte de las señales, así que su resultado puede alejarse de este promedio.</div>";

    "</tbody></table></div>";
  h+="<h3 class=\"bt\">¿Depende de 3 operaciones?</h3><div class=\"tw\"><table class=\"bt chica\"><thead><tr><th></th>"+th+"</tr></thead><tbody>"+

    fila("Las 3 mejores = % de la ganancia",function(x){return x.concentracion.top3_pct==null?"—":fnu(x.concentracion.top3_pct,0)+"%"})+

    "</tbody></table></div>"+
    "<div class=\"nota\" style=\"margin-top:2px\">Las 3 mejores superan el 100% cuando sin ellas el resultado es negativo. \"—\" = las operaciones cerradas no suman ganancia. \"Abiertas al final\" = posiciones sin vender, valuadas al último cierre (no entran en las métricas de operaciones cerradas).</div>";

      S.tiempo.map(function(f0,i){return "<tr><td>"+dmy2(f0.inicio)+(f0.semanas?" <small>+"+f0.semanas+" sem</small>":"")+"</td>"+cel(fpc(f0.merval_pct,1),sg(f0.merval_pct))+

      "<div class=\"nota\" style=\"margin-top:2px\">Misma estrategia, mismas reglas, solo cambia el día de arranque (con el capital completo). Sin salida por tiempo, los 2 lugares de la cartera pueden quedar ocupados meses por las primeras compras: el resultado depende del día en que se empieza. Amplitud entre el mejor y el peor arranque: "+
      K.map(function(k){var v=S[k].map(function(f){return f.retorno_pct});return N[k]+" "+fnu(Math.max.apply(null,v)-Math.min.apply(null,v),0)+" pp"}).join(", ")+".</div>";
  }
  var u=c.senales_una_por_una;
  if(u&&u.tiempo&&u.tiempo.n){
    h+="<div class=\"aviso ambar\" style=\"margin-top:10px\"><b>Las "+u.tiempo.n+" señales una por una</b> (sin el límite de 2 posiciones, neto de costos; las que siguen abiertas al final se valúan al último cierre): "+
      K.map(function(k){var x=u[k];return N[k]+": "+fpc(x.media_pct,2)+" de media, "+fnu(x.ganadoras_pct,1)+"% ganadoras, profit factor "+fnu(x.profit_factor,2)}).join("; ")+
      ". Las entradas son las mismas en las tres; solo cambia cuándo se sale.</div>";

function mostrar(i){   // i = posición dentro de los informes de la función elegida
  var lista=INDICE.filter(function(e){return e.funcion===fn});
  if(!lista.length){$("hist").hidden=true;$("hora").textContent="";$("info").textContent="";
    $("out").innerHTML='<div class="vacio">'+(fn==="venta"?"La función VENTA (15:50) todavía no está definida.":fn==="backtest"?"Todavía no hay backtest. Se genera a pedido: en GitHub, Actions → Backtest → Run workflow.":"Todavía no hay informes. El primero sale a las 12:00 (o corré uno ahora).")+'</div>';return Promise.resolve()}
  var e=lista[i||0];$("hist").hidden=lista.length<2;
  $("hist").innerHTML=lista.map(function(x,k){return '<option value="'+k+'"'+(k===(i||0)?" selected":"")+'>'+dmy(x.fecha)+" "+x.hora+(x.etiqueta?" · "+x.etiqueta:(fn==="backtest"?" · Base":""))+(k===0?" · último":"")+'</option>'}).join("");
  $("out").innerHTML='<div class="vacio">Descifrando…</div>';var fnPedido=fn;
  return traer("data/"+e.archivo).then(function(env){return descifrar(KEY,env)}).then(function(r){if(fnPedido!==fn)return;CUR=r;(fn==="backtest"?pintarBT:pintar)(r,e)})}
